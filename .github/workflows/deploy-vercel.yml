name: Deploy static site to Vercel

on:
  push:
    branches:
      - claude/ia-maths-pensee-wrr9l0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: human-vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish and verify
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing VERCEL_DEPLOY_HOOK_URL secret"
            exit 1
          fi
          site_matches() {
            curl --fail --silent --show-error --max-time 10 \
              https://areweai.dev/ -o "$RUNNER_TEMP/index.html" || return 1
            cmp -s index.html "$RUNNER_TEMP/index.html" || return 1
            for asset in media/og.png media/og-en.png; do
              curl --fail --silent --show-error --max-time 10 \
                "https://areweai.dev/$asset" -o "$RUNNER_TEMP/asset" || return 1
              cmp -s "$asset" "$RUNNER_TEMP/asset" || return 1
            done
          }
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            for attempt in $(seq 1 18); do
              if site_matches; then
                echo "Vercel Git deployment is live"
                exit 0
              fi
              sleep 5
            done
          fi
          curl --fail --silent --show-error --request POST \
            "$VERCEL_DEPLOY_HOOK_URL" -o "$RUNNER_TEMP/vercel-hook-response.json"
          for attempt in $(seq 1 60); do
            if site_matches; then
              echo "Deploy Hook published this commit"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Production files did not match this commit within five minutes"
          exit 1
