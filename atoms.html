.pvl .m{font:500 .92rem/1.45 var(--display);color:var(--soft);font-style:italic;overflow-wrap:anywhere}
.body{flex:1;overflow-y:auto;padding:4px 22px 22px;scrollbar-width:thin}
.lab{display:flex;justify-content:space-between;margin:1.15rem 0 .55rem;font:500 .6rem/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--soft)}
.shapes{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.shp{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.35rem .2rem .55rem;border-radius:14px;border:1px solid var(--line);transition:border-color .2s,background .2s}

.shp:hover{border-color:rgba(236,233,226,.4)}
.shp[aria-checked="true"]{border-color:rgb(var(--c,var(--blue)));background:rgba(var(--c,var(--blue)),.08);box-shadow:0 0 22px rgba(var(--c,var(--blue)),.18)}
.cols{display:flex;flex-wrap:wrap;gap:.55rem}
.col{all:unset;cursor:pointer;width:2rem;height:2rem;border-radius:50%;position:relative;background:radial-gradient(circle at 50% 50%,rgb(var(--k)) 0 22%,rgba(var(--k),.35) 40%,rgba(var(--k),0) 70%);outline:1px solid var(--line);outline-offset:2px;transition:transform .2s}
.col:hover{transform:scale(1.1)}
.col[aria-checked="true"]{outline:1.5px solid rgb(var(--k));outline-offset:3px;transform:scale(1.12)}
.colname{font:400 .6rem/1 var(--mono);letter-spacing:.1em;color:rgb(var(--c,var(--blue)));text-transform:none}
.fld{width:100%;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03);padding:.8rem .9rem;outline:none;transition:border-color .2s,box-shadow .2s}

.cnt{font:400 .58rem/1 var(--mono);letter-spacing:.06em}
.cnt.hot{color:rgb(255,122,92)}
.chk{display:flex;align-items:center;gap:.6rem;margin-top:1rem;font:500 .64rem/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--soft);cursor:pointer}

.chk input:checked{background:rgba(var(--c,var(--blue)),.25);border-color:rgb(var(--c,var(--blue)))}
.chk input:checked::after{transform:translateX(.9rem);background:rgb(var(--c,var(--blue)))}

}
@media (prefers-reduced-motion:reduce){.cta .dot{animation:none}#make{transition:none}}
