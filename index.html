<style>
:root{
  color-scheme: light;

html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg)}
body{font-family:var(--mono);-webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:none}

<body>

<section class="sr">
  <h1>Et si nous étions le plus gros LLM jamais observé&nbsp;?</h1>
  <p>Une expérience animée à l'encre de Chine, en neuf chapitres, qui suit la réflexion de Mathieu.</p>

</section>

<script>
(() => {
const TAU = Math.PI * 2, GA = 137.50776 * Math.PI / 180;
const reduced = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  return (x >>> 0) / 4294967296;

const gauss = (u, v) => Math.sqrt(-2 * Math.log(u + 1e-9)) * Math.cos(TAU * v);
const fr = s => s.replace(/ ([?:!;])/g, ' $1');

/* ——— le temps ——— */
const END = 134;
const CH = [[0,'Ouverture'],[10,"L'IA"],[22.5,'Le monde'],[44,'La fleur'],[58.5,'Au fond'],[76.5,"L'univers"],[96.5,'Le cerveau'],[106,'Le miroir'],[120,'La question']];
const REST = [9, 20, 43, 55, 69, 88, 104, 117, 132];
const CAPS = [
  { t0: 3.2, t1: 9.6, k: 'title', kick: 'HUman · une réflexion de Mathieu', text: 'Et si nous étions le plus gros LLM jamais observé ?' },
  { t0: 11.6, t1: 16.4, text: "Pour une IA, chaque mot est un point dans l'espace." },
  { t0: 16.8, t1: 21.6, text: 'Une phrase est un chemin. Le mot suivant : un calcul, puis un tirage au sort.' },
  { t0: 23.6, t1: 28.4, text: "J'ai voulu comprendre l'IA. J'ai trouvé des maths." },
  { t0: 28.9, t1: 33.4, text: "Alors j'ai levé les yeux." },
  { t0: 33.9, t1: 38.2, text: 'Un arbre : une seule règle, répétée.' },
  { t0: 38.6, t1: 43.6, text: "La mer : des ondes simples qui s'additionnent." },
  { t0: 48.6, t1: 53.2, text: 'Une fleur : chaque graine à 137,5° de la précédente.' },
  { t0: 53.6, t1: 58.4, text: "Elle n'a jamais appris les maths. C'est la solution qui a survécu." },
  { t0: 59.2, t1: 64.6, text: 'Plus près.' },
  { t0: 65.4, t1: 70.4, text: 'Dans chaque graine, un code. Quatre lettres, lues trois par trois.' },
  { t0: 72.6, t1: 77.2, text: 'Et tout au fond, la nature tire au sort.' },
  { t0: 79.8, t1: 84.6, text: 'Le monde se calcule. Il ne se prévoit pas.' },
  { t0: 85.2, t1: 89.6, text: 'Des spirales, de la fleur à la galaxie.' },
  { t0: 91.2, t1: 96.2, text: "Et si l'univers n'était qu'un grand algorithme ?" },
  { t0: 97.6, t1: 102.4, text: 'Et moi ? Des signaux entre 86 milliards de neurones.' },
  { t0: 102.8, t1: 106.8, text: 'Un cerveau qui prédit la suite. Comme une IA ?' },
  { t0: 109.2, t1: 112.8, text: 'Suis-je une IA ?' },
  { t0: 113.2, t1: 117.6, text: 'Pas un LLM. Un corps qui a appris à parler en dernier.' },
  { t0: 118, t1: 122.4, text: 'Un corps qui se maintient seul, et qui ressent.' },
  { t0: 123, t1: 1e9, k: 'final', text: "Si tout est calcul, pourquoi est-ce que ça fait quelque chose d'être moi ?" }
];
CAPS.forEach(c => { c.text = fr(c.text); });
document.getElementById('sr-list').innerHTML = CAPS.map(c => `<li>${c.text}</li>`).join('');

/* ——— couleurs : papier le jour, encre la nuit ——— */
const PAPER = [234,232,226], NIGHT = [12,11,10], INKC = [20,19,18], LIGHT = [233,230,222];
let FG = 'rgb(20,19,18)', BG = 'rgb(234,232,226)', NGT = -1;
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const root = document.documentElement;
function setNight(n) {
  if (Math.abs(n - NGT) < 0.002) return;
  NGT = n;
  FG = `rgb(${mix(INKC, LIGHT, n)})`; BG = `rgb(${mix(PAPER, NIGHT, n)})`;
  root.style.setProperty('--fg', FG); root.style.setProperty('--bg', BG);
  root.style.colorScheme = n > .5 ? 'dark' : 'light';
}

/* ——— toiles ——— */
const cv = document.getElementById('c'), out = cv.getContext('2d');
const sc = document.createElement('canvas'), ctx = sc.getContext('2d');
let W = 1, H = 1, DPR = 1, dprCap = 1.75, S0b = 1, LAND = true, CX = 0, CY = 0, MM = 1, NP = 1400, jump = true;
let zMoon = 5, CF = [0, 0], RF = 1, PCX = 0, PCY = 0, SP = 1, PGAP = 1;
const NS = 600, NPMAX = 1600;

/* ——— taches d'encre pré-rendues ——— */
function blotCanvas(col, seed) {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d');
  x.fillStyle = `rgba(${col},.07)`; x.beginPath(); x.arc(32, 32, 27, 0, TAU); x.fill();
  for (let i = 0; i < 52; i++) {
    const a = hash(seed, i) * TAU, rr = Math.sqrt(hash(seed, i + 99)) * 10;
    x.fillStyle = `rgba(${col},.34)`; x.beginPath(); x.arc(32 + Math.cos(a) * rr, 32 + Math.sin(a) * rr, 5 + hash(seed, i + 7) * 5.5, 0, TAU); x.fill();
  }
  return c;
}
const SPI = [0,1,2,3].map(v => blotCanvas(INKC.join(','), 100 + v));
const SPL = [0,1,2,3].map(v => blotCanvas(LIGHT.join(','), 200 + v));
function spr(x, y, r, a, v, sy) {
  if (a <= 0.004 || r <= 0) return;
  const s = r * 4, h = s * (sy || 1);
  if (NGT < 0.999) { ctx.globalAlpha = c01(a * (1 - NGT)); ctx.drawImage(SPI[v & 3], x - s / 2, y - h / 2, s, h); }
  if (NGT > 0.001) { ctx.globalAlpha = c01(a * NGT); ctx.drawImage(SPL[v & 3], x - s / 2, y - h / 2, s, h); }
  ctx.globalAlpha = 1;
}

/* ——— le pinceau ——— */
const cr = (a, b, c, d, t, t2, t3) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
function dense(P, step) {
  const o = [];
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || P[i + 1];
    const n = Math.max(1, Math.min(48, Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / step)));
    for (let k = 0; k < n; k++) { const t = k / n, t2 = t * t, t3 = t2 * t; o.push([cr(p0[0], p1[0], p2[0], p3[0], t, t2, t3), cr(p0[1], p1[1], p2[1], p3[1], t, t2, t3)]); }
  }
  o.push(P[P.length - 1]);
  return o;
}
function taperF(t, a, b) {
  let v = 1;
  if (t < a) v = Math.sin(t / a * Math.PI / 2);
  if (t > 1 - b) v = Math.min(v, Math.sin((1 - t) / b * Math.PI / 2));
  return Math.max(0.05, v);
}
function ribbon(P, w, o) {
  o = o || {};
  const al = o.alpha ?? 0.9, prog = o.prog ?? 1;
  if (al <= 0.004 || w < 0.12 || P.length < 2 || prog <= 0) return;
  const Q = o.raw ? P : dense(P, Math.max(2.5, Math.min(10, w * 0.8)));
  const n = Q.length, L = new Float32Array(n);
  for (let i = 1; i < n; i++) L[i] = L[i - 1] + Math.hypot(Q[i][0] - Q[i - 1][0], Q[i][1] - Q[i - 1][1]);
  const tot = L[n - 1] || 1, cut = tot * Math.min(1, prog);
  const ta = o.taper ? o.taper[0] : 0.12, tb = o.taper ? o.taper[1] : 0.3, sd = o.seed || 1;
  const lx = [], ly = [], rx = [], ry = [], cx = [], cy = [], nx = [], ny = [], ww = [];
  for (let i = 0; i < n; i++) {
    let x = Q[i][0], y = Q[i][1], d = L[i];
    if (i > 0 && d > cut) { const f = (cut - L[i - 1]) / ((d - L[i - 1]) || 1); x = Q[i - 1][0] + (x - Q[i - 1][0]) * f; y = Q[i - 1][1] + (y - Q[i - 1][1]) * f; d = cut; }
    const a = Q[Math.max(0, i - 1)], b = Q[Math.min(n - 1, i + 1)];
    const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1, Nx = -dy / l, Ny = dx / l;
    const wv = w * taperF(d / tot, ta, tb) * (1 + 0.12 * Math.sin(d / Math.max(4, w * 1.3) + sd)) * 0.5;
    lx.push(x + Nx * wv); ly.push(y + Ny * wv); rx.push(x - Nx * wv); ry.push(y - Ny * wv);
    cx.push(x); cy.push(y); nx.push(Nx); ny.push(Ny); ww.push(wv);
    if (L[i] >= cut) break;
  }
  const m = lx.length; if (m < 2) return;
  ctx.globalAlpha = c01(al); ctx.fillStyle = FG;
  ctx.beginPath(); ctx.moveTo(lx[0], ly[0]);
  for (let i = 1; i < m; i++) ctx.lineTo(lx[i], ly[i]);
  for (let i = m - 1; i >= 0; i--) ctx.lineTo(rx[i], ry[i]);
  ctx.closePath(); ctx.fill();
  if (prog < 1) { ctx.beginPath(); ctx.arc(cx[m - 1], cy[m - 1], ww[m - 1], 0, TAU); ctx.fill(); }
  const dry = o.dry ?? 0.35;
  if (dry > 0 && w > 3.5) {
    ctx.strokeStyle = BG;
    for (const k of [-0.78, -0.3, 0.62, 0.84]) {
      const h1 = hash(sd, Math.round(k * 100)), h2 = hash(sd, Math.round(k * 100) + 7);
      ctx.lineWidth = Math.max(0.5, w * (0.018 + 0.03 * h1)); ctx.globalAlpha = c01(al * dry * (0.5 + 0.5 * h2));
      ctx.setLineDash([w * (3 + h1 * 9), w * (0.6 + h2 * 1.8), w * (0.8 + h2 * 3), w * (2 + h1 * 5)]); ctx.lineDashOffset = sd * 13 + h1 * w * 10;
      ctx.beginPath();
      for (let i = 0; i < m; i++) { const f = k * ww[i]; if (i) ctx.lineTo(cx[i] + nx[i] * f, cy[i] + ny[i] * f); else ctx.moveTo(cx[i] + nx[i] * f, cy[i] + ny[i] * f); }
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }
  ctx.globalAlpha = 1;
}
function pen(P, a, w, dash, prog) {
  if (a <= 0.004 || P.length < 2) return;
  prog = prog ?? 1; if (prog <= 0) return;
  let L = 0; const seg = [];
  for (let i = 1; i < P.length; i++) { const l = Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); seg.push(l); L += l; }
  let rem = L * Math.min(1, prog);
  ctx.globalAlpha = c01(a); ctx.strokeStyle = FG; ctx.lineWidth = w || 1; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(P[0][0], P[0][1]);
  for (let i = 1; i < P.length && rem > 0; i++) {
    const l = seg[i - 1];
    if (l <= rem) { ctx.lineTo(P[i][0], P[i][1]); rem -= l; }
    else { const f = rem / l; ctx.lineTo(P[i - 1][0] + (P[i][0] - P[i - 1][0]) * f, P[i - 1][1] + (P[i][1] - P[i - 1][1]) * f); rem = 0; }
  }
  ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
}
function txt(s, x, y, px, f, a, align) {
  if (a <= 0.004 || px > 500 || px < 1) return;
  ctx.globalAlpha = c01(a); ctx.fillStyle = FG;
  ctx.font = `${f === 'd' ? 500 : 400} ${px}px ${f === 'd' ? DISPLAY : MONO}`;
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y); ctx.globalAlpha = 1;
}
function fillPoly(P, a) {
  if (a <= 0.004) return;
  ctx.globalAlpha = c01(a); ctx.fillStyle = BG;
  ctx.beginPath(); P.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;

function ensoPts(cx, cy, r, a0, sw, n, wob, seed) {
  const P = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, a = (a0 + sw * t) * Math.PI / 180, rr = r * (1 + wob * Math.sin(a * 3 + seed) + (hash(seed, i) - 0.5) * wob * 0.5);
    P.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
  }
  return P;
}

  const P = [];
  for (let i = 0; i <= n; i++) { const a = i / n * TAU, rr = r * (1 + wob * Math.sin(a * 3 + seed) + (hash(seed, i % n) - .5) * wob); P.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]); }
  return P;
}

/* ——— le rivage (niveau 0, unité = hauteur de la scène) ——— */
const MOON = [0.42, -0.30];
const MOON_PTS = ensoPts(MOON[0], MOON[1], 0.07, 200, 320, 44, 0.02, 5);
const TH = { ox: -0.66, oy: 0.122, s: 0.00095 };
const THINKER = [
  { p: [[30,396],[110,386],[205,390],[290,398]], w: 30, a: .14, tp: [.25,.3], dry: .7 },
  { p: [[36,398],[50,350],[88,312],[140,302],[182,314],[204,352],[212,398]], w: 5, a: .75, tp: [.1,.4], dry: .6 },
  { p: [[142,98],[124,138],[110,192],[112,248],[128,300]], w: 11 },
  { p: ensoPts(162, 62, 33, 200, 320, 22, 0.03, 3), w: 8, tp: [.06,.5] },
  { p: [[128,300],[176,292],[224,290],[252,297]], w: 12 },
  { p: [[252,298],[255,345],[250,392]], w: 9 },
  { p: [[240,395],[260,397],[280,394]], w: 6 },
  { p: [[140,312],[188,320],[226,324],[232,362],[226,394]], w: 8, a: .5 },
  { p: [[146,118],[172,172],[204,232],[234,280]], w: 8 },
  { p: [[236,282],[233,222],[216,152],[194,108]], w: 8 },
  { p: [[180,100],[192,97],[200,107],[193,118]], w: 7 }
];

let AC = null, master = null, seaG = null, droneLP = null, audioOn = false;

  const Ctor = window.AudioContext || window.webkitAudioContext; if (!Ctor) return false;
  AC = new Ctor(); master = AC.createGain(); master.gain.value = 0; master.connect(AC.destination);
  droneLP = AC.createBiquadFilter(); droneLP.type = 'lowpass'; droneLP.frequency.value = 380; droneLP.connect(master);
  [[55, 'sine', .12, -4], [82.41, 'sine', .08, 5], [110, 'triangle', .035, 0]].forEach(([f, t, g, d]) => { const o = AC.createOscillator(); o.type = t; o.frequency.value = f; o.detune.value = d; const gn = AC.createGain(); gn.gain.value = g; o.connect(gn); gn.connect(droneLP); o.start(); });
  const buf = AC.createBuffer(1, AC.sampleRate * 3, AC.sampleRate), d = buf.getChannelData(0); let b = 0;
  for (let i = 0; i < d.length; i++) { b = 0.985 * b + 0.015 * (Math.random() * 2 - 1); d[i] = b * 4; }
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true; const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
  seaG = AC.createGain(); seaG.gain.value = 0; src.connect(lp); lp.connect(seaG); seaG.connect(master); src.start();
  return true;
}
function plink(n) {
  if (!audioOn || !AC) return;
  const t = AC.currentTime, f = [392, 440, 523.25, 587.33, 659.25, 783.99, 880, 523.25, 392][n % 9];
  [[f, .07], [f * 2.01, .025]].forEach(([fq, g]) => { const o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = fq; const gn = AC.createGain(); gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(g, t + 0.01); gn.gain.exponentialRampToValueAtTime(0.0001, t + 3); o.connect(gn); gn.connect(master); o.start(t); o.stop(t + 3.1); });
}
function audioFrame(T) {
  if (!AC || !audioOn) return;
  const coast = rv(T, 23, 3) * (1 - rv(T, 45, 3));
  seaG.gain.setTargetAtTime(coast * (0.35 + 0.25 * Math.sin(T * 0.9)), AC.currentTime, 0.2);
  droneLP.frequency.setTargetAtTime(320 + 520 * Math.max(0, NGT), AC.currentTime, 0.5);
}

/* ——— les phrases ——— */
const capsEl = document.getElementById('caps'), live = new Map();
function makeCap(c) {
  const el = document.createElement('p'); el.className = 'cap' + (c.k ? ' ' + c.k : '');
  let h = c.kick ? `<span class="kick">${c.kick}</span>` : '', n = 0;
  h += c.text.split(' ').map(w => `<span class="w">${[...w].map(ch => `<span class="ch" style="transition-delay:${(n++) * 22}ms">${ch}</span>`).join('')}</span>`).join(' ');
  el.innerHTML = h; capsEl.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
  return el;
}
function updateCaps(T) {
  CAPS.forEach((c, i) => {
    const on = T >= c.t0 && T < c.t1;
    if (on && !live.has(i)) live.set(i, makeCap(c));
    else if (!on && live.has(i)) { const el = live.get(i); live.delete(i); el.classList.add('out'); setTimeout(() => el.remove(), 1100); }
  });
}

/* ——— les chapitres ——— */
const chapEl = document.getElementById('chap');
CH.forEach(([t, name], i) => {
  const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', `Chapitre ${i + 1} : ${name}`);
  b.innerHTML = `<span class="lbl">${name}</span><span class="bar"><i></i></span>`;
  b.addEventListener('click', () => seek(reduced ? REST[i] : t + 0.01, true));
  chapEl.appendChild(b);
});
const chapBtns = [...chapEl.children], chapFill = chapBtns.map(b => b.querySelector('i'));
let lastChap = -1;
function chapterAt(T) { let ci = 0; CH.forEach(([t], i) => { if (T >= t) ci = i; }); return ci; }
function updateChap(T) {
  const ci = chapterAt(T);
  CH.forEach(([t], i) => {
    const t1 = i < CH.length - 1 ? CH[i + 1][0] : END;
    chapFill[i].style.transform = `scaleX(${c01((T - t) / (t1 - t)).toFixed(3)})`;
  });
  if (ci !== lastChap) {
    chapBtns.forEach((b, i) => { b.classList.toggle('on', i === ci); if (i === ci) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current'); });
    if (lastChap >= 0) plink(ci);
    lastChap = ci;
  }
}

/* ——— la boucle ——— */
let T = reduced ? 9 : 0, playing = !reduced, last = performance.now(), prevLogS = 0, slow = 0;
const endEl = document.getElementById('end'), ppBtn = document.getElementById('pp');
function setPlaying(p) { playing = p; ppBtn.textContent = p ? 'Pause' : 'Lecture'; jump = true; }
function seek(t, play) { T = Math.max(0, Math.min(END, t)); jump = true; if (play && !reduced) setPlaying(true); }
ppBtn.addEventListener('click', () => { if (T >= END) seek(0); setPlaying(!playing); });
if (reduced) ppBtn.textContent = 'Lecture';
document.getElementById('again').addEventListener('click', () => { seek(0); setPlaying(!reduced); });
document.getElementById('snd').addEventListener('click', e => {
  if (!AC && !initAudio()) return;
  audioOn = !audioOn; e.currentTarget.setAttribute('aria-pressed', String(audioOn));
  if (AC.state === 'suspended') AC.resume();
  master.gain.setTargetAtTime(audioOn ? 0.55 : 0, AC.currentTime, 0.6);
});
window.addEventListener('wheel', e => { e.preventDefault(); seek(T + e.deltaY * (e.deltaMode ? 0.4 : 0.012)); }, { passive: false });
let ty = null;
window.addEventListener('touchstart', e => { ty = e.touches[0].clientY; }, { passive: true });
window.addEventListener('touchmove', e => { if (ty === null) return; const y = e.touches[0].clientY; seek(T + (ty - y) * 0.04); ty = y; }, { passive: true });
window.addEventListener('touchend', () => { ty = null; }, { passive: true });
window.addEventListener('keydown', e => {
  if (e.target && e.target.closest && e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
  const ci = chapterAt(T);
  if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); const n = Math.min(CH.length - 1, ci + 1); seek(reduced ? REST[n] : CH[n][0] + 0.01); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); const n = Math.max(0, ci - 1); seek(reduced ? REST[n] : CH[n][0] + 0.01); }
});

function resize() {
  W = innerWidth; H = innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, dprCap);
  cv.width = sc.width = Math.round(W * DPR); cv.height = sc.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  LAND = W / H > 1.15; MM = Math.min(W, H);
  S0b = Math.min(H, W / 1.5);
  CX = W / 2 + (LAND ? 0.1 * W : 0); CY = H / 2 + (LAND ? 0 : -0.06 * H);
  NP = W * H < 520000 ? 1000 : 1600;
  zMoon = 0.34 * MM / (0.07 * S0b);
  CF = [CX, CY]; RF = 0.3 * MM;
  SP = Math.min(0.62 * H / 470, 0.92 * W / 620); PGAP = 0.09 * MM; PCX = CX + (LAND ? 0.02 * W : 0); PCY = LAND ? H * 0.5 : H * 0.4;
  computeSK(); jump = true;
}
addEventListener('resize', resize);
resize();

(function grain() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
    for (let i = 0; i < 9000; i++) { x.fillStyle = `rgba(40,36,30,${(hash(i, 1) * 0.1).toFixed(3)})`; x.fillRect(hash(i, 2) * 256, hash(i, 3) * 256, 1, 1); }
    for (let i = 0; i < 160; i++) { const px = hash(i, 4) * 256, py = hash(i, 5) * 256, a = hash(i, 6) * TAU, l = 6 + hash(i, 7) * 26; x.strokeStyle = `rgba(60,55,45,${(0.03 + hash(i, 8) * 0.05).toFixed(3)})`; x.lineWidth = .5; x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l); x.stroke(); }
    document.getElementById('grain').style.setProperty('--grain', `url(${c.toDataURL()})`);
  } catch (e) {}
})();

function render(T) {
  setNight(rv(T, 76, 3) - rv(T, 107, 4));
  ctx.globalAlpha = 1; ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  const v = camera(Math.min(T, 76.9));
  const V = { v, moonC: MP(v[0], MOON[0], MOON[1]), moonR: 0.07 * v[0].S };
  if (T < 79) { drawCoast(v[0], T); drawFlower(v[1], T); drawSeed(v[2], T); drawNucleus(v[3], T); drawAtom(v[4], T); }
  drawDrop(T, V);
  drawSpace(T);
  drawParticles(T, V);
  if (T < 62) drawFlowerOverlay(v[1], T);
  drawCloudLabels(T, V);
  const logS = Math.log(v[0].S), speed = Math.abs(logS - prevLogS); prevLogS = logS;
  let k = reduced || jump ? 1 : Math.max(0.28, 0.62 - speed * 9);
  if (!reduced && !jump && T > 76.8 && T < 80.5) k = Math.min(k, 0.3);
  out.globalAlpha = k; out.drawImage(sc, 0, 0); out.globalAlpha = 1;
  jump = false;
  updateCaps(T); updateChap(T); audioFrame(T);
  endEl.classList.toggle('on', T >= 131);
}
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (playing && T < END) T = Math.min(END, T + dt);
  if (playing && T >= END) setPlaying(false);
  if (playing && dt > 0.034 && DPR > 1) { if (++slow > 90) { dprCap = 1; slow = 0; resize(); } } else slow = Math.max(0, slow - 1);
  if (playing || jump) render(T);
  requestAnimationFrame(frame);
}
window.__seek = t => { T = t; jump = true; render(T); };
requestAnimationFrame(frame);
})();
</script>
