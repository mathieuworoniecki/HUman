requestAnimationFrame(frame);
/* ——— le logo : des étoiles en orbite, des paramètres, des neurones… qui deviennent 人 ——— */
(function () {

  const lx = cv.getContext('2d'), brand = cv.closest('.brand');
  const lh = (a, b) => { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

  const STAR = [[248, 247, 255], [157, 180, 255], [202, 216, 255], [255, 244, 234], [255, 206, 158], [255, 122, 92]];
  const INK = [[20, 19, 18], [38, 78, 214], [70, 110, 220], [60, 55, 50], [196, 120, 40], [206, 58, 40]];
  const pickC = u => u < .36 ? 0 : u < .6 ? 1 : u < .74 ? 2 : u < .84 ? 3 : u < .92 ? 4 : 5;

  // trois orbites d'atome, inclinées, des électrons qui y circulent
  for (let o = 0; o < 3; o++) for (let j = 0; j < 12; j++) P.push({ kind: 1, o, ph: j / 12 * Math.PI * 2 + o, sp: 0.55 + 0.25 * o, c: pickC(lh(o * 31 + j, 2)), s: 0.7 + lh(o * 31 + j, 3) * 0.9, tw: lh(o * 31 + j, 4) });
  // un nuage de paramètres, sur une sphère qui tourne lentement
  for (let j = 0; j < 30; j++) { const y = 1 - 2 * (j + .5) / 30, r = Math.sqrt(1 - y * y), th = j * 2.39996; P.push({ kind: 2, x: Math.cos(th) * r, y, z: Math.sin(th) * r, R: 0.62 + lh(j, 5) * 0.33, c: pickC(lh(j, 6)), s: 0.55 + lh(j, 7) * 0.8, tw: lh(j, 8) }); }
  const N = P.length;
  // 人 : deux traits, échantillonnés, pour tous les points
  const S1 = [[0.06, -0.8], [0.02, -0.45], [-0.14, -0.05], [-0.36, 0.38], [-0.66, 0.74]], S2 = [[-0.06, -0.12], [0.14, 0.2], [0.38, 0.5], [0.7, 0.74]];
  const samp = (S, n) => { const L = []; let tot = 0; for (let i = 1; i < S.length; i++) { const l = Math.hypot(S[i][0] - S[i - 1][0], S[i][1] - S[i - 1][1]); L.push(l); tot += l; } const o = []; for (let k = 0; k < n; k++) { let d = (k + .5) / n * tot, i = 0; while (i < L.length - 1 && d > L[i]) { d -= L[i]; i++; } const f = d / L[i]; o.push([S[i][0] + (S[i + 1][0] - S[i][0]) * f, S[i][1] + (S[i + 1][1] - S[i][1]) * f]); } return o; };
  const GL = samp(S1, 36).concat(samp(S2, 30));
  const order = []; for (let i = 3; i < N; i++) order.push(i); order.sort((a, b) => lh(a, 9) - lh(b, 9));
  order.forEach((i, j) => { P[i].g = GL[j % GL.length]; });
  P[0].g = [-0.05, -0.14]; P[1].g = [0.04, -0.62]; P[2].g = [-0.5, 0.6];
  // halos : un petit sprite par couleur, pour la nuit et le jour
  const mk = (col, night) => { const c = document.createElement('canvas'); c.width = c.height = 32; const x = c.getContext('2d'), g = x.createRadialGradient(16, 16, 0, 16, 16, 16); g.addColorStop(0, `rgba(${col},${night ? 1 : .55})`); g.addColorStop(.18, `rgba(${col},${night ? .55 : .22})`); g.addColorStop(1, `rgba(${col},0)`); x.fillStyle = g; x.fillRect(0, 0, 32, 32); return c; };
  const HN = STAR.map(c => mk(c.join(','), true)), HD = INK.map(c => mk(c.join(','), false));
  let hov = 0, hovT = 0, W = 0, R = 0, dpr = 1;
  brand.addEventListener('pointerenter', () => { hovT = 1; }); brand.addEventListener('pointerleave', () => { hovT = 0; });
  const size = () => { const b = cv.getBoundingClientRect(); dpr = Math.min(2.5, window.devicePixelRatio || 1); W = b.width; cv.width = Math.round(b.width * dpr); cv.height = Math.round(b.height * dpr); R = W * 0.42; };

  const Q = new Array(N);

    if (VNOW === null) requestAnimationFrame(frame); else if (now !== VNOW) return;
    if (!W || cv.width !== Math.round(cv.getBoundingClientRect().width * dpr)) size();

    const ay = t * 0.35, ax = 0.42 + 0.15 * Math.sin(t * 0.21), cy = Math.cos(ay), sy = Math.sin(ay), cx = Math.cos(ax), sx = Math.sin(ax);

      const p = P[i]; let x, y, z;

      else if (p.kind === 1) { const a = p.ph + t * p.sp, ox = Math.cos(a) * 0.86, oy = Math.sin(a) * 0.3, rot = p.o * 1.047 + t * 0.07; x = ox * Math.cos(rot) - oy * Math.sin(rot); y = ox * Math.sin(rot) + oy * Math.cos(rot); z = Math.sin(a) * 0.5 * (p.o % 2 ? 1 : -1); }
      else { const a = t * 0.5, ca = Math.cos(a), sa = Math.sin(a), br = 1 + 0.06 * Math.sin(t * 2 + i); x = (p.x * ca - p.z * sa) * p.R * br; z = (p.x * sa + p.z * ca) * p.R * br; y = p.y * p.R * br; }

      const f = form * (0.85 + 0.15 * lh(i, 11)), g = p.g;

      lx.beginPath();

        const a = k / 48 * Math.PI * 2, ox = Math.cos(a) * 0.86, oy = Math.sin(a) * 0.3, rot = o * 1.047 + t * 0.07;
        const x = ox * Math.cos(rot) - oy * Math.sin(rot), y = ox * Math.sin(rot) + oy * Math.cos(rot), z = Math.sin(a) * 0.5 * (o % 2 ? 1 : -1);
        let X = x * cy - z * sy, Z = x * sy + z * cy; const Y = y * cx - Z * sx; Z = y * sx + Z * cx;
        const pp = 1 / (1.6 - Z * 0.5), qx = W / 2 + X * pp * 1.6 * R, qy = W / 2 + Y * pp * 1.6 * R;

    }

      lx.strokeStyle = night ? `rgba(200,212,255,${al.toFixed(3)})` : `rgba(20,19,18,${(al * .8).toFixed(3)})`;

      const p = P[q.i], d = (q.z + 1) / 2, tw = 0.7 + 0.3 * Math.sin(t * (2 + p.tw * 3) + p.tw * 20), s = p.s * (0.7 + 0.6 * d) * (p.kind === 0 ? 1.3 : 1) * (1 + 0.25 * form);

    }
    lx.globalAlpha = 1; lx.globalCompositeOperation = 'source-over';
  }
  VT.logo = frame; requestAnimationFrame(frame);
})();
})();
