  { let t0 = M0; MONT.forEach(([, d], k) => { if (crossed(p, T, t0)) { noise(.35, .12, { f: 800 + k * 300, to: 4000, q: .8 }); tone(PENT[(9 - k) % 10], .4, .04); } t0 += d; }); }
  if (T > MEND && T < 141.8 && Math.floor(T * 3) !== Math.floor(p * 3) && hash(Math.floor(T * 3) * 7, 1) >= 0.35) noise(.22, .09, { f: 180, q: 6 });
  if (crossed(p, T, 142.2)) tone(PENT[3], 1.6, .05);
  if (crossed(p, T, 144.35)) { tone(PENT[5], 1.2, .07, { type: 'triangle' }); noise(.06, .12, { f: 2500 }); }
  for (let l = 0; l < 4; l++) if (crossed(p, T, 145.25 + l * .16)) tone(PENT[6 + l], .3, .04);
  if (T > FC) { const a = Math.floor(3 * (p - FC) * 0.9 * 3), b = Math.floor(3 * (T - FC) * 0.9 * 3); if (b !== a) tone(PENT[[0, 5, 7][((b % 3) + 3) % 3]] * 2, .25, .018); }
  if (crossed(p, T, FC)) { tone(98, 7, .14, { att: .02 }); tone(196.4, 6, .05); tone(294.2, 5, .025); }
}

/* ——— la souris déforme la matière, sans arrêter le film ——— */
let MX = -1e4, MY = -1e4, SMX = -1e4, SMY = -1e4, MIN = 0, MACT = 0, needs = false;
window.addEventListener('pointermove', e => { if (e.pointerType === 'touch') return; MX = e.clientX; MY = e.clientY; MIN = 1; if (SMX < -1e3) { SMX = MX; SMY = MY; } needs = true; }, { passive: true });
document.documentElement.addEventListener('mouseleave', () => { MIN = 0; needs = true; });
function mouseStep() { if (SMX < -1e3) return; SMX = lerp(SMX, MX, .2); SMY = lerp(SMY, MY, .2); MACT = lerp(MACT, MIN, .08); }
function mouseFx(name, o) {
  if (MACT < 0.01) return;
  const dx = o.x - SMX, dy = o.y - SMY, d2 = dx * dx + dy * dy;
  if (name === 'atom') { const R = 0.32 * MM, k = 0.55 * MACT * Math.exp(-d2 / (2 * R * R)); o.x -= dx * k; o.y -= dy * k; return; }
  const R = (name === 'seed' ? 0.075 : name === 'title' ? 0.09 : 0.11) * MM; if (d2 > R * R) return;
  const d = Math.sqrt(d2) || 1, f = Math.pow(1 - d / R, 2) * R * 0.7 * MACT;
  o.x += dx / d * f; o.y += dy / d * f;
}
function drawCursor() {
  if (MACT < 0.02) return;
  ctx.globalAlpha = .45 * MACT; ctx.strokeStyle = FG; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(SMX, SMY, 16, 0, TAU); ctx.stroke();
  ctx.globalAlpha = .9 * MACT; ctx.fillStyle = FG; ctx.beginPath(); ctx.arc(MX, MY, 2.2, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
}

/* ——— les phrases ——— */
const capsEl = document.getElementById('caps'), live = new Map();
function makeCap(c) {
  const el = document.createElement('p'); el.className = 'cap' + (c.k ? ' ' + c.k : '');
  let h = c.kick ? `<span class="kick">${c.kick}</span>` : '', n = 0;
  h += c.text.split(' ').map(w => `<span class="w">${[...w].map(ch => `<span class="ch" style="transition-delay:${(n++) * 22}ms">${ch}</span>`).join('')}</span>`).join(' ');
  el.innerHTML = h; capsEl.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
  return el;
}
function updateCaps(T) {
  CAPS.forEach((c, i) => {
    const on = T >= c.t0 && T < c.t1;
    if (on && !live.has(i)) live.set(i, makeCap(c));
    else if (!on && live.has(i)) { const el = live.get(i); live.delete(i); el.classList.add('out'); setTimeout(() => el.remove(), 1100); }
  });
}

/* ——— les chapitres ——— */
const chapEl = document.getElementById('chap');
CH.forEach(([t, name], i) => {
  const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', LX.chapter_n.replace('{0}', i + 1).replace('{1}', name));
  b.innerHTML = `<span class="lbl">${name}</span><span class="bar"><i></i></span>`;
  b.addEventListener('click', () => seek(realOf(reduced ? REST[i] : t + 0.01), true));
  chapEl.appendChild(b);
});
const chapBtns = [...chapEl.children], chapFill = chapBtns.map(b => b.querySelector('i'));
let lastChap = -1;
function chapterAt(T) { let ci = 0; CH.forEach(([t], i) => { if (T >= t) ci = i; }); return ci; }
function updateChap(T) {
  const ci = chapterAt(T);
  CH.forEach(([t], i) => {
    const t1 = i < CH.length - 1 ? CH[i + 1][0] : END;
    chapFill[i].style.transform = `scaleX(${c01((T - t) / (t1 - t)).toFixed(3)})`;
  });
  if (ci !== lastChap) {
    chapBtns.forEach((b, i) => { b.classList.toggle('on', i === ci); if (i === ci) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current'); });
    if (lastChap >= 0) plink(ci);
    lastChap = ci;
  }
}

/* ——— la boucle ——— */
let T = reduced ? realOf(8.8) : 0, playing = !reduced, last = performance.now(), prevLogS = 0, slow = 0;
const endEl = document.getElementById('end'), ppBtn = document.getElementById('pp');
function setPlaying(p) { playing = p; ppBtn.textContent = p ? LX.pause : LX.play; jump = true; }
function seek(t, play) { T = Math.max(0, Math.min(END + EXTRA, t)); jump = true; if (play && !reduced) setPlaying(true); }
ppBtn.addEventListener('click', () => { if (T >= END + EXTRA) seek(0); setPlaying(!playing); });
ppBtn.textContent = reduced ? LX.play : LX.pause;
document.getElementById('again').addEventListener('click', () => { seek(0); setPlaying(!reduced); });
document.getElementById('rst').addEventListener('click', () => { loopN = 0; live.forEach(el => el.remove()); live.clear(); seek(reduced ? realOf(REST[0]) : 0); if (!reduced) setPlaying(true); });
document.getElementById('snd').addEventListener('click', e => {
  if (!AC && !initAudio()) return;
  audioOn = !audioOn; e.currentTarget.setAttribute('aria-pressed', String(audioOn)); e.currentTarget.textContent = LX.sound; e.currentTarget.classList.add('used');
  if (AC.state === 'suspended') AC.resume();
  master.gain.setTargetAtTime(audioOn ? 0.55 : 0, AC.currentTime, 0.6);
});
window.addEventListener('wheel', e => { e.preventDefault(); seek(T + e.deltaY * (e.deltaMode ? 0.4 : 0.012)); }, { passive: false });
let ty = null;
window.addEventListener('touchstart', e => { ty = e.touches[0].clientY; }, { passive: true });
window.addEventListener('touchmove', e => { if (ty === null) return; const y = e.touches[0].clientY; seek(T + (ty - y) * 0.04); ty = y; }, { passive: true });
window.addEventListener('touchend', () => { ty = null; }, { passive: true });
window.addEventListener('keydown', e => {
  if (e.target && e.target.closest && e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
  const ci = chapterAt(story(T));
  if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); const n = Math.min(CH.length - 1, ci + 1); seek(realOf(reduced ? REST[n] : CH[n][0] + 0.01)); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); const n = Math.max(0, ci - 1); seek(realOf(reduced ? REST[n] : CH[n][0] + 0.01)); }
});

function resize() {
  W = innerWidth; H = innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, dprCap);
  cv.width = sc.width = Math.round(W * DPR); cv.height = sc.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bl.width = Math.max(1, Math.ceil(cv.width / 6)); bl.height = Math.max(1, Math.ceil(cv.height / 6));
  LAND = W / H > 1.15; MM = Math.min(W, H); C0[1] = LAND ? 0 : -0.16;
  S0b = Math.min(H, W / 1.5);
  CX = W / 2 + (LAND ? 0.1 * W : 0); CY = H / 2 + (LAND ? 0 : -0.06 * H);
  NP = W * H < 520000 ? 1200 : 2400; CPN = W * H < 520000 ? 2600 : 4200;
  zMoon = 0.34 * MM / (0.07 * S0b);
  CF = [CX, CY]; RF = 0.3 * MM;
  SP = LAND ? Math.min(0.6 * H / 470, 0.92 * W / 620) : Math.min(0.5 * H / 470, 0.98 * W / 560); PGAP = 0.09 * MM; PCX = CX + (LAND ? 0.02 * W : 0); PCY = LAND ? H * 0.55 : H * 0.56;
  computeSK(); buildTitle(); buildCaps(); jump = true;
}
addEventListener('resize', resize);
buildGlyphs();
resize();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { buildGlyphs(); buildTitle(); buildCaps(); jump = true; });

(function grain() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
    for (let i = 0; i < 9000; i++) { x.fillStyle = `rgba(40,36,30,${(hash(i, 1) * 0.1).toFixed(3)})`; x.fillRect(hash(i, 2) * 256, hash(i, 3) * 256, 1, 1); }
    for (let i = 0; i < 160; i++) { const px = hash(i, 4) * 256, py = hash(i, 5) * 256, a = hash(i, 6) * TAU, l = 6 + hash(i, 7) * 26; x.strokeStyle = `rgba(60,55,45,${(0.03 + hash(i, 8) * 0.05).toFixed(3)})`; x.lineWidth = .5; x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l); x.stroke(); }
    document.getElementById('grain').style.setProperty('--grain', `url(${c.toDataURL()})`);
  } catch (e) {}
})();

function render(T) {
  WSP = null; ctx.direction = RTL ? 'rtl' : 'ltr';
  setNight(Math.max(1 - rv(T, 44.3, 3.4), rv(T, 76, 3) - rv(T, 115, 4), rv(T, 129.6, 1.4)));
  ctx.globalAlpha = 1; ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  const v = camera(Math.min(T, 76.9));
  const V = { v, c3: T > 8.5 && T < 29.5 ? cam3(T) : null, vA: T > 139 ? camera(74)[4] : null };
  if (T >= M0 && T < MEND) drawMontage(T);
  else {
    if (T < 79) { drawCoast(v[0], T); drawFlower(v[1], T); drawSeed(v[2], T); drawNucleus(v[3], T); drawAtom(v[4], T); }
    drawPrompt(T);
    drawSpace(T);
    drawBrain(T);
    DISP = false; drawParticles(T, V); DISP = true;
    if (T < 62) drawFlowerOverlay(v[1], T);
    drawWordSpace(T, V.c3);
    drawNeuronDemo(T); drawBrainPredict(T);
  }
  drawFinale(T);
  drawCaps(T);
  drawLens(T, V);
  mouseStep(); DISP = false; drawCursor(); DISP = true;
  const logS = Math.log(v[0].S), speed = Math.abs(logS - prevLogS); prevLogS = logS;
  let k = reduced || jump ? 1 : Math.max(0.28, 0.62 - speed * 9);
  if (!reduced && !jump) {
    if (T > 1.5 && T < 4.8) k = Math.min(k, 0.3);
    if (T > 9.3 && T < 11) k = Math.min(k, 0.35);
    if (T > 22.6 && T < 26) k = Math.min(k, 0.4);
    if (T > 76.8 && T < 80.5) k = Math.min(k, 0.3);
    if (T > 129.8 && T < M0) k = Math.min(k, 0.25);
    if (T >= M0 && T < MEND) k = 0.7;
  }
  out.globalAlpha = k; out.drawImage(sc, 0, 0); out.globalAlpha = 1;
  if (!reduced && NGT > 0.05) {
    blx.globalCompositeOperation = 'copy'; blx.drawImage(sc, 0, 0, bl.width, bl.height);
    out.globalCompositeOperation = 'lighter'; out.globalAlpha = 0.32 * NGT * k; out.drawImage(bl, 0, 0, cv.width, cv.height);
    out.globalCompositeOperation = 'source-over'; out.globalAlpha = 1;
  }
  jump = false;
  updateCaps(T); updateChap(T); audioFrame(T);
  endEl.classList.toggle('on', T >= 153);
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (playing && T < END + EXTRA) T = Math.min(END + EXTRA, T + dt);
  if (playing && T >= END + EXTRA) { loopN++; seek(0); }
  if (playing && dt > 0.034 && DPR > 1) { if (++slow > 90) { dprCap = 1; slow = 0; resize(); } } else slow = Math.max(0, slow - 1);
  if (!playing && (Math.abs(SMX - MX) > .5 || Math.abs(SMY - MY) > .5 || Math.abs(MACT - MIN) > .01)) needs = true;
  if (playing || jump || needs) { TR = T; render(story(T)); needs = false; }
  requestAnimationFrame(frame);
}
window.__seek = t => { T = realOf(t); TR = T; jump = true; render(story(T)); };
window.__frame = t => { T = t; TR = T; render(story(T)); };
window.__pause = () => setPlaying(false);
requestAnimationFrame(frame);
})();
</script>
