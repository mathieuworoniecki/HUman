<style>

body{font-family:var(--mono);-webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#grain{position:fixed;inset:0;pointer-events:none;background-image:var(--grain,none);background-size:256px 256px;mix-blend-mode:multiply;opacity:.55}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 55% 50%,transparent 58%,rgba(0,0,0,.13) 100%)}

.brand{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:clamp(18px,3vw,36px);display:flex;align-items:center;gap:.7rem;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}

}

<section class="sr">
  <h1>Et si nous étions le plus gros LLM jamais observé&nbsp;?</h1>
  <p>Une expérience animée à l'encre de Chine, en neuf chapitres, qui suit la réflexion de Mathieu.</p>
  <ol id="sr-list"></ol>
</section>

<script>
(() => {
const TAU = Math.PI * 2, GA = 137.50776 * Math.PI / 180;
const reduced = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const DISPLAY = '"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",Georgia,serif';
const MONO = '"IBM Plex Mono",ui-monospace,Menlo,monospace';
const c01 = v => v < 0 ? 0 : v > 1 ? 1 : v;

  x = Math.imul(x ^ (x >>> 13), 1274126177); x ^= x >>> 16;
  return (x >>> 0) / 4294967296;

const fr = s => s.replace(/ ([?:!;])/g, ' $1');

/* ——— le temps ——— */
const END = 134;
const QUESTIONS = ['comment marche une IA ?', 'et moi, comment je marche ?', "qu'est-ce qui me rend vivant ?"];
let loopN = 0;
const CH = [[0,'Ouverture'],[10,"L'IA"],[23.2,'Le monde'],[44,'La fleur'],[58.5,'Au fond'],[76.5,"L'univers"],[96.5,'Le cerveau'],[106,'Le miroir'],[120,'La question']];
const REST = [8.8, 21, 41.5, 55, 69, 88, 104, 117, 132];
const CAPS = [
  { t0: 11.2, t1: 14.0, text: "Pour une IA, chaque mot est un point dans l'espace." },
  { t0: 14.4, t1: 22.6, text: 'Une phrase est un chemin. Le mot suivant : un calcul, puis un tirage au sort.' },
  { t0: 23.4, t1: 27.8, text: "J'ai voulu comprendre l'IA. J'ai trouvé des maths." },
  { t0: 28.2, t1: 32.6, text: "Alors j'ai levé les yeux." },
  { t0: 33, t1: 37.8, text: 'Et partout où je regardais, des calculs.' },
  { t0: 38.2, t1: 43.4, text: "La mer : des ondes simples qui s'additionnent." },
  { t0: 48.6, t1: 53.2, text: 'Une fleur : chaque graine à 137,5° de la précédente.' },
  { t0: 53.6, t1: 58.4, text: "Elle n'a jamais appris les maths. C'est la solution qui a survécu." },
  { t0: 59.2, t1: 64.6, text: 'Plus près.' },
  { t0: 65.4, t1: 70.4, text: 'Dans chaque graine, un code. Quatre lettres, lues trois par trois.' },
  { t0: 72.6, t1: 77.2, text: 'Et tout au fond, la nature tire au sort.' },
  { t0: 79.8, t1: 84.6, text: 'Le monde se calcule. Il ne se prévoit pas.' },
  { t0: 85.2, t1: 89.6, text: 'Des spirales, de la fleur à la galaxie.' },
  { t0: 91.2, t1: 96.2, text: "Et si l'univers n'était qu'un grand algorithme ?" },
  { t0: 97.6, t1: 102.4, text: 'Et moi ? Des signaux entre 86 milliards de neurones.' },
  { t0: 102.8, t1: 106.8, text: 'Un cerveau qui prédit la suite. Comme une IA ?' },
  { t0: 109.2, t1: 112.8, text: 'Suis-je une IA ?' },
  { t0: 113.2, t1: 117.6, text: 'Pas un LLM. Un corps qui a appris à parler en dernier.' },
  { t0: 118, t1: 122.4, text: 'Un corps qui se maintient seul, et qui ressent.' },
  { t0: 123, t1: 1e9, k: 'final', text: "Si tout est calcul, pourquoi est-ce que ça fait quelque chose d'être moi ?" }
];
CAPS.forEach(c => { c.text = fr(c.text); });
document.getElementById('sr-list').innerHTML = CAPS.map(c => `<li>${c.text}</li>`).join('');

/* ——— couleurs : papier le jour, encre la nuit ——— */
const PAPER = [234,232,226], NIGHT = [12,11,10], INKC = [20,19,18], LIGHT = [233,230,222];
let FG = 'rgb(20,19,18)', BG = 'rgb(234,232,226)', NGT = -1;
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const root = document.documentElement;
function setNight(n) {
  if (Math.abs(n - NGT) < 0.002) return;
  NGT = n;
  FG = `rgb(${mix(INKC, LIGHT, n)})`; BG = `rgb(${mix(PAPER, NIGHT, n)})`;
  root.style.setProperty('--fg', FG); root.style.setProperty('--bg', BG);
  root.style.colorScheme = n > .5 ? 'dark' : 'light';
}

/* ——— toiles ——— */
const cv = document.getElementById('c'), out = cv.getContext('2d');
const sc = document.createElement('canvas'), ctx = sc.getContext('2d');
const bl = document.createElement('canvas'), blx = bl.getContext('2d');
let W = 1, H = 1, DPR = 1, dprCap = 1.75, S0b = 1, LAND = true, CX = 0, CY = 0, MM = 1, NP = 1400, jump = true;
let zMoon = 5, CF = [0, 0], RF = 1, PCX = 0, PCY = 0, SP = 1, PGAP = 1;
const NS = 600, NPMAX = 2400;

/* ——— taches d'encre pré-rendues ——— */
function blotCanvas(col, seed) {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d');
  x.fillStyle = `rgba(${col},.07)`; x.beginPath(); x.arc(32, 32, 27, 0, TAU); x.fill();
  for (let i = 0; i < 52; i++) {
    const a = hash(seed, i) * TAU, rr = Math.sqrt(hash(seed, i + 99)) * 10;
    x.fillStyle = `rgba(${col},.34)`; x.beginPath(); x.arc(32 + Math.cos(a) * rr, 32 + Math.sin(a) * rr, 5 + hash(seed, i + 7) * 5.5, 0, TAU); x.fill();
  }
  return c;
}
const SPI = [0,1,2,3].map(v => blotCanvas(INKC.join(','), 100 + v));
const SPL = [0,1,2,3].map(v => blotCanvas(LIGHT.join(','), 200 + v));
let DISP = true, DX = 0, DY = 0;
function dsp(x, y) {
  const dx = x - SMX, dy = y - SMY, d2 = dx * dx + dy * dy, R = 0.13 * MM;
  if (d2 >= R * R) { DX = x; DY = y; return; }
  const d = Math.sqrt(d2) || 1, f = Math.pow(1 - d / R, 2) * R * 0.45 * MACT;
  DX = x + dx / d * f; DY = y + dy / d * f;
}
const dspP = P => (DISP && MACT > 0.01) ? P.map(p => { dsp(p[0], p[1]); return [DX, DY]; }) : P;
function spr(x, y, r, a, v, sy) {
  if (a <= 0.004 || r <= 0) return;
  if (DISP && MACT > 0.01) { dsp(x, y); x = DX; y = DY; }
  const s = r * 4, h = s * (sy || 1);
  if (NGT < 0.999) { ctx.globalAlpha = c01(a * (1 - NGT)); ctx.drawImage(SPI[v & 3], x - s / 2, y - h / 2, s, h); }
  if (NGT > 0.001) { ctx.globalAlpha = c01(a * NGT); ctx.drawImage(SPL[v & 3], x - s / 2, y - h / 2, s, h); }
  ctx.globalAlpha = 1;
}

/* ——— le pinceau ——— */
const cr = (a, b, c, d, t, t2, t3) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
function dense(P, step) {
  const o = [];
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || P[i + 1];
    const n = Math.max(1, Math.min(48, Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / step)));
    for (let k = 0; k < n; k++) { const t = k / n, t2 = t * t, t3 = t2 * t; o.push([cr(p0[0], p1[0], p2[0], p3[0], t, t2, t3), cr(p0[1], p1[1], p2[1], p3[1], t, t2, t3)]); }
  }
  o.push(P[P.length - 1]);
  return o;
}
function taperF(t, a, b) {
  let v = 1;
  if (t < a) v = Math.sin(t / a * Math.PI / 2);
  if (t > 1 - b) v = Math.min(v, Math.sin((1 - t) / b * Math.PI / 2));
  return Math.max(0.05, v);
}
function ribbon(P, w, o) {
  o = o || {};
  const al = o.alpha ?? 0.9, prog = o.prog ?? 1;
  if (al <= 0.004 || w < 0.12 || P.length < 2 || prog <= 0) return;
  const Q = dspP(o.raw ? P : dense(P, Math.max(2.5, Math.min(10, w * 0.8))));
  const n = Q.length, L = new Float32Array(n);
  for (let i = 1; i < n; i++) L[i] = L[i - 1] + Math.hypot(Q[i][0] - Q[i - 1][0], Q[i][1] - Q[i - 1][1]);
  const tot = L[n - 1] || 1, cut = tot * Math.min(1, prog);
  const ta = o.taper ? o.taper[0] : 0.12, tb = o.taper ? o.taper[1] : 0.3, sd = o.seed || 1;
  const lx = [], ly = [], rx = [], ry = [], cx = [], cy = [], nx = [], ny = [], ww = [];
  for (let i = 0; i < n; i++) {
    let x = Q[i][0], y = Q[i][1], d = L[i];
    if (i > 0 && d > cut) { const f = (cut - L[i - 1]) / ((d - L[i - 1]) || 1); x = Q[i - 1][0] + (x - Q[i - 1][0]) * f; y = Q[i - 1][1] + (y - Q[i - 1][1]) * f; d = cut; }
    const a = Q[Math.max(0, i - 1)], b = Q[Math.min(n - 1, i + 1)];
    const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1, Nx = -dy / l, Ny = dx / l;
    const wv = w * taperF(d / tot, ta, tb) * (1 + 0.12 * Math.sin(d / Math.max(4, w * 1.3) + sd)) * 0.5;
    lx.push(x + Nx * wv); ly.push(y + Ny * wv); rx.push(x - Nx * wv); ry.push(y - Ny * wv);
    cx.push(x); cy.push(y); nx.push(Nx); ny.push(Ny); ww.push(wv);
    if (L[i] >= cut) break;
  }
  const m = lx.length; if (m < 2) return;
  ctx.globalAlpha = c01(al); ctx.fillStyle = FG;
  ctx.beginPath(); ctx.moveTo(lx[0], ly[0]);
  for (let i = 1; i < m; i++) ctx.lineTo(lx[i], ly[i]);
  for (let i = m - 1; i >= 0; i--) ctx.lineTo(rx[i], ry[i]);
  ctx.closePath(); ctx.fill();
  if (prog < 1) { ctx.beginPath(); ctx.arc(cx[m - 1], cy[m - 1], ww[m - 1], 0, TAU); ctx.fill(); }
  const dry = o.dry ?? 0.35;
  if (dry > 0 && w > 3.5) {
    ctx.strokeStyle = BG;
    for (const k of [-0.78, -0.3, 0.62, 0.84]) {
      const h1 = hash(sd, Math.round(k * 100)), h2 = hash(sd, Math.round(k * 100) + 7);
      ctx.lineWidth = Math.max(0.5, w * (0.018 + 0.03 * h1)); ctx.globalAlpha = c01(al * dry * (0.5 + 0.5 * h2));
      ctx.setLineDash([w * (3 + h1 * 9), w * (0.6 + h2 * 1.8), w * (0.8 + h2 * 3), w * (2 + h1 * 5)]); ctx.lineDashOffset = sd * 13 + h1 * w * 10;
      ctx.beginPath();
      for (let i = 0; i < m; i++) { const f = k * ww[i]; if (i) ctx.lineTo(cx[i] + nx[i] * f, cy[i] + ny[i] * f); else ctx.moveTo(cx[i] + nx[i] * f, cy[i] + ny[i] * f); }
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }
  ctx.globalAlpha = 1;
}
function pen(P, a, w, dash, prog) {
  if (a <= 0.004 || P.length < 2) return;
  P = dspP(P);
  prog = prog ?? 1; if (prog <= 0) return;
  let L = 0; const seg = [];
  for (let i = 1; i < P.length; i++) { const l = Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); seg.push(l); L += l; }
  let rem = L * Math.min(1, prog);
  ctx.globalAlpha = c01(a); ctx.strokeStyle = FG; ctx.lineWidth = w || 1; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(P[0][0], P[0][1]);
  for (let i = 1; i < P.length && rem > 0; i++) {
    const l = seg[i - 1];
    if (l <= rem) { ctx.lineTo(P[i][0], P[i][1]); rem -= l; }
    else { const f = rem / l; ctx.lineTo(P[i - 1][0] + (P[i][0] - P[i - 1][0]) * f, P[i - 1][1] + (P[i][1] - P[i - 1][1]) * f); rem = 0; }
  }
  ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
}
function txt(s, x, y, px, f, a, align, halo) {
  if (a <= 0.004 || px > 500 || px < 1) return;
  if (DISP && MACT > 0.01) { dsp(x, y); x = DX; y = DY; }
  ctx.globalAlpha = c01(a); ctx.fillStyle = FG;
  ctx.font = `${f === 'd' ? 500 : 400} ${px}px ${f === 'd' ? DISPLAY : MONO}`;
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
  if (halo) { ctx.lineJoin = 'round'; ctx.strokeStyle = BG; ctx.lineWidth = Math.max(3, px * 0.3); ctx.strokeText(s, x, y); }
  ctx.fillText(s, x, y); ctx.globalAlpha = 1;
}
function fillPoly(P, a) {
  if (a <= 0.004) return;
  P = dspP(P);
  ctx.globalAlpha = c01(a); ctx.fillStyle = BG;
  ctx.beginPath(); P.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
}
function ensoPts(cx, cy, r, a0, sw, n, wob, seed) {
  const P = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, a = (a0 + sw * t) * Math.PI / 180, rr = r * (1 + wob * Math.sin(a * 3 + seed) + (hash(seed, i) - 0.5) * wob * 0.5);
    P.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
  }
  return P;
}
function circlePts(cx, cy, r, n, wob, seed) {
  const P = [];
  for (let i = 0; i <= n; i++) { const a = i / n * TAU, rr = r * (1 + wob * Math.sin(a * 3 + seed) + (hash(seed, i % n) - .5) * wob); P.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]); }
  return P;
}

    out.globalCompositeOperation = 'lighter'; out.globalAlpha = 0.32 * NGT * k; out.drawImage(bl, 0, 0, cv.width, cv.height);
    out.globalCompositeOperation = 'source-over'; out.globalAlpha = 1;
  }
  jump = false;
  updateCaps(T); updateChap(T); audioFrame(T);
  endEl.classList.toggle('on', T >= 131);
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (playing && T < END) T = Math.min(END, T + dt);
  if (playing && T >= END) { loopN++; seek(0); }
  if (playing && dt > 0.034 && DPR > 1) { if (++slow > 90) { dprCap = 1; slow = 0; resize(); } } else slow = Math.max(0, slow - 1);
  if (!playing && (Math.abs(SMX - MX) > .5 || Math.abs(SMY - MY) > .5 || Math.abs(MACT - MIN) > .01)) needs = true;
  if (playing || jump || needs) { render(T); needs = false; }
  requestAnimationFrame(frame);
}
window.__seek = t => { T = t; jump = true; render(T); };
window.__frame = t => { T = t; render(T); };
window.__pause = () => setPlaying(false);
requestAnimationFrame(frame);
})();
</script>
